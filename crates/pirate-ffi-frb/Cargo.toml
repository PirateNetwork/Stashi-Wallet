[package]
name = "pirate-ffi-frb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = ["embedded-sapling-params", "stashi-transports"]
embedded-sapling-params = ["pirate-wallet-service/embedded-sapling-params", "pirate-core/embedded-sapling-params"]
stashi-transports = ["pirate-wallet-service/stashi-transports"]
# Enable FRB generated code (after running flutter_rust_bridge_codegen)
# Stashi builds enable `frb` with --no-default-features; keep those builds
# self-contained while consumer native SDKs use Direct and may supply parameters.
frb = ["embedded-sapling-params", "stashi-transports"]

[dependencies]
pirate-wallet-service = { path = "../pirate-wallet-service", default-features = false }
pirate-core = { path = "../pirate-core", default-features = false }

flutter_rust_bridge.workspace = true
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
