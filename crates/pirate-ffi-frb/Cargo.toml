[package]
name = "pirate-ffi-frb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = ["embedded-sapling-params", "embedded-tor", "embedded-i2p"]
embedded-sapling-params = ["pirate-wallet-service/embedded-sapling-params", "pirate-core/embedded-sapling-params"]
embedded-tor = ["pirate-wallet-service/embedded-tor"]
embedded-i2p = ["pirate-wallet-service/embedded-i2p"]
# Enable FRB generated code (after running flutter_rust_bridge_codegen)
# Stashi builds enable `frb` with --no-default-features; keep those builds
# self-contained even though native SDK hosts can supply their own parameters
# and network transport.
frb = ["embedded-sapling-params", "embedded-tor", "embedded-i2p"]

[dependencies]
pirate-wallet-service = { path = "../pirate-wallet-service", default-features = false }
pirate-core = { path = "../pirate-core", default-features = false }

flutter_rust_bridge.workspace = true
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
