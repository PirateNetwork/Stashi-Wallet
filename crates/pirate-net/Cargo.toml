[package]
name = "pirate-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["embedded-tor", "embedded-i2p"]
embedded-tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:liblzma-sys"]
embedded-i2p = []

[dependencies]
pirate-core = { path = "../pirate-core", default-features = false }

# Tor/Arti for privacy-first networking
arti-client = { workspace = true, features = ["bridge-client", "onion-service-client", "pt-client"], optional = true }
tor-rtcompat = { workspace = true, optional = true }

tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
tower = { workspace = true }
tonic = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
tokio-socks = "0.5"
directories = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls", "http2", "system-proxy"] }
parking_lot = { workspace = true }
once_cell = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
rustls-pki-types = { version = "1.12", default-features = false, features = ["alloc"] }

# Arti accepts XZ-compressed directory responses. Build liblzma from its
# bundled source on macOS so distributed binaries never depend on Homebrew.
[target.'cfg(target_os = "macos")'.dependencies]
liblzma-sys = { version = "0.4.6", default-features = false, features = ["static"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
