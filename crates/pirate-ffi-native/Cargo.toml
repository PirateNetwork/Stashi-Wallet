[package]
name = "pirate-ffi-native"
version = "0.3.8"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = ["embedded-sapling-params", "embedded-tor", "embedded-i2p"]
embedded-sapling-params = ["pirate-wallet-service/embedded-sapling-params"]
embedded-tor = ["pirate-wallet-service/embedded-tor"]
embedded-i2p = ["pirate-wallet-service/embedded-i2p"]

[dependencies]
pirate-wallet-service = { path = "../pirate-wallet-service", default-features = false }

serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
