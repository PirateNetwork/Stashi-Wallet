buildscript {
  def kotlinVersion = rootProject.ext.has('kotlinVersion')
    ? rootProject.ext.get('kotlinVersion')
    : '2.2.21'

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.13.2'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def androidBinaryPackage = providers.gradleProperty('pirateWalletAndroidBinaryPackage').orNull
// Use the same resolver as package verification, including exact version checks
// and support for hoisted node_modules. Selecting external never adds embedded libs.
def resolveCommand = ['node', file('../scripts/resolve-android-packages.js').absolutePath]
if (androidBinaryPackage != null) {
  resolveCommand.add(androidBinaryPackage)
}
def resolveProcess = new ProcessBuilder(resolveCommand)
  .directory(rootProject.projectDir).start()
def resolvedOutput = resolveProcess.inputStream.getText('UTF-8')
def resolveError = resolveProcess.errorStream.getText('UTF-8')
if (resolveProcess.waitFor() != 0) {
  throw new GradleException("Cannot resolve Pirate Android native libraries: ${resolveError.trim()}")
}
def androidJniLibsDirs = new groovy.json.JsonSlurper().parseText(resolvedOutput)

android {
  namespace "com.pirate.wallet.reactnative"
  compileSdkVersion safeExtGet('compileSdkVersion', 36)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 36)
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      jniLibs.srcDirs androidJniLibsDirs
    }
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  google()
  mavenCentral()
  maven {
    url("${rootProject.projectDir}/../node_modules/react-native/android")
  }
}

dependencies {
  implementation 'com.facebook.react:react-native:+'
}
