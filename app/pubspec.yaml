name: pirate_wallet
description: Stashi Wallet - Privacy-first ARRR wallet
publish_to: 'none'
version: 1.2.2+10202

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.2'

dependencies:
  archive: ^4.2.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  dart_pg: ^2.1.0
  decimal: ^3.2.6
  ffi: ^2.2.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_acrylic: ^1.1.4
  flutter_animate: ^4.5.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Must match the Rust workspace and FRB_CODEGEN_VERSION in CI.
  flutter_rust_bridge: 2.13.0
  # v11 removes legacy migration paths; Komodo also requires the v10 API.
  flutter_secure_storage: ^10.3.1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  komodo_defi_framework:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_framework
  komodo_defi_local_auth:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_local_auth
  komodo_defi_rpc_methods:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_rpc_methods
  komodo_defi_sdk:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_sdk
  komodo_defi_types:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_types
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  screen_retriever: ^0.2.2
  share_plus: ^13.3.0
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  uuid: ^4.6.0
  web: ^1.1.1
  window_manager: ^0.5.2
  zxing2: ^0.2.1

dev_dependencies:
  analyzer: ^13.3.0
  build_runner: ^2.16.1
  ffigen: ^22.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.31.1

dependency_overrides:
  komodo_cex_market_data:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_cex_market_data
  komodo_coin_updates:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_coin_updates
  komodo_coins:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_coins
  komodo_defi_framework:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_framework
  komodo_defi_local_auth:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_local_auth
  komodo_defi_rpc_methods:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_rpc_methods
  komodo_defi_sdk:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_sdk
  komodo_defi_types:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_defi_types
  komodo_ui:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_ui
  komodo_wallet_build_transformer:
    git:
      url: https://github.com/OswaldKardingson/komodo-defi-sdk-flutter.git
      ref: main
      path: packages/komodo_wallet_build_transformer
  local_auth: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/bip39/
    - assets/security/
    - assets/icons/
  
  # Fonts (local only)
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans.ttf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2/NotoSansSymbols2.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari/NotoSansDevanagari.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC/NotoSansSC.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP/NotoSansJP.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR/NotoSansKR.ttf
