plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeystore = true
}

dependencies {
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "androidx.core:core-ktx:1.13.1"
}

android {
    namespace = "com.pirate.wallet"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.pirate.wallet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Komodo DeFi Framework's Android package requires API 28+.
        minSdk = 28
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
    }

    // Flutter Rust Bridge: Copy native libraries
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Leave unsigned unless key.properties is provided locally.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

// Check the merged manifest, including permissions contributed by plugins.
// A UI-only feature flag cannot remove Play's foreground-service declaration.
androidComponents {
    onVariants(selector().all()) { variant ->
        def manifest = variant.artifacts.get(
            com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE)
        def suffix = variant.name.capitalize()
        def verifyTask = tasks.register("verify${suffix}NoForegroundService") {
            inputs.file(manifest)
            doLast {
                def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                factory.setNamespaceAware(true)
                def document = factory.newDocumentBuilder().parse(manifest.get().asFile)
                def androidNs = "http://schemas.android.com/apk/res/android"
                def permissions = document.getElementsByTagName("uses-permission")
                for (int i = 0; i < permissions.length; i++) {
                    def name = permissions.item(i).getAttributeNS(androidNs, "name")
                    if (name.startsWith("android.permission.FOREGROUND_SERVICE")) {
                        throw new GradleException("Disabled background sync declares ${name}")
                    }
                }
                def services = document.getElementsByTagName("service")
                for (int i = 0; i < services.length; i++) {
                    def service = services.item(i)
                    if (service.hasAttributeNS(androidNs, "foregroundServiceType") ||
                        service.getAttributeNS(androidNs, "name") ==
                            "androidx.work.impl.foreground.SystemForegroundService") {
                        throw new GradleException("Disabled foreground service in merged manifest")
                    }
                }
            }
        }
        tasks.matching { it.name in ["assemble${suffix}", "bundle${suffix}"] }.configureEach {
            dependsOn(verifyTask)
        }
    }
}
